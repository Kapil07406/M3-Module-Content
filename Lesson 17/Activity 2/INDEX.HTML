<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Spinner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2>Bootstrap Spinners</h2>

        <h5 class="mt-4">1. Border Spinner</h5>

        <div class="spinner-border text-primary"></div>

        <h5 class="mt-4">2. Success Spinner</h5>

        <div class="spinner-border text-success"></div>

        <h5 class="mt-4">3. Grow Spinner</h5>

        <div class="spinner-grow text-danger"></div>

        <h5 class="mt-4">4. Small Spinner</h5>

        <div class="spinner-border spinner-border-sm text-warning"></div>

        <h5 class="mt-4">5. Loading Button</h5>

        <button class="btn btn-primary" disabled>
            <span class="spinner-border spinner-border-sm"></span>
            Loading...
        </button>

    </div>

</body>

</html>
