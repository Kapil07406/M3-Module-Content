<!DOCTYPE html>
<html>

<head>
    <title>Different Pagination Designs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-5">
            Bootstrap Pagination Designs
        </h2>

        <!-- Pagination 1 -->
        <h4>1. Simple Pagination</h4>

        <nav aria-label="Simple pagination">
            <ul class="pagination">

                <li class="page-item disabled">
                    <a class="page-link" href="#">Previous</a>
                </li>

                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">3</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>

            </ul>
        </nav>

        <hr>

        <!-- Pagination 2 -->
        <h4>2. Large Pagination</h4>

        <nav aria-label="Large pagination">
            <ul class="pagination pagination-lg">

                <li class="page-item">
                    <a class="page-link" href="#">Previous</a>
                </li>

                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>

            </ul>
        </nav>

        <hr>

        <!-- Pagination 3 -->
        <h4>3. Small Pagination</h4>

        <nav aria-label="Small pagination">
            <ul class="pagination pagination-sm">

                <li class="page-item">
                    <a class="page-link" href="#">Previous</a>
                </li>

                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>

                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>

            </ul>
        </nav>

    </div>

</body>

</html>
