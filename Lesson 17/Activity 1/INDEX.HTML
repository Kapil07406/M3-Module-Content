<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Our Courses</h2>

        <div class="row">

            <!-- Card 1 -->
            <div class="col-md-4 mb-3">
                <div class="card">
                    <img src="https://picsum.photos/400/200?random=1" class="card-img-top" alt="Web Development">

                    <div class="card-body">
                        <h5 class="card-title">Web Development</h5>

                        <p class="card-text">
                            Learn HTML, CSS and JavaScript.
                        </p>

                        <a href="#" class="btn btn-primary">
                            Learn More
                        </a>
                    </div>
                </div>
            </div>

            <!-- Card 2 -->
            <div class="col-md-4 mb-3">
                <div class="card">
                    <img src="https://picsum.photos/400/200?random=2" class="card-img-top" alt="Python">

                    <div class="card-body">
                        <h5 class="card-title">Python Programming</h5>

                        <p class="card-text">
                            Learn Python programming from basics.
                        </p>

                        <a href="#" class="btn btn-success">
                            Learn More
                        </a>
                    </div>
                </div>
            </div>

            <!-- Card 3 -->
            <div class="col-md-4 mb-3">
                <div class="card">
                    <img src="https://picsum.photos/400/200?random=3" class="card-img-top" alt="Robotics">

                    <div class="card-body">
                        <h5 class="card-title">Robotics</h5>

                        <p class="card-text">
                            Explore robotics and technology.
                        </p>

                        <a href="#" class="btn btn-danger">
                            Learn More
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
