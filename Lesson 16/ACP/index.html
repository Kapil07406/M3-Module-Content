<!DOCTYPE html>
<html>

<head>
    <title>My Image Slider</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            Welcome to My School
        </h2>

        <div id="mySlider" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#mySlider" data-bs-slide-to="0" class="active"></button>

                <button type="button" data-bs-target="#mySlider" data-bs-slide-to="1"></button>

                <button type="button" data-bs-target="#mySlider" data-bs-slide-to="2"></button>
            </div>

            <!-- Slider Images -->
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/1040/1000/400" class="d-block w-100" alt="School campus">

                    <div class="carousel-caption">
                        <h3>Our School</h3>
                        <p>A place to learn and grow.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1011/1000/400" class="d-block w-100" alt="Nature">

                    <div class="carousel-caption">
                        <h3>Learning Together</h3>
                        <p>Explore new ideas every day.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/180/1000/400" class="d-block w-100" alt="Technology">

                    <div class="carousel-caption">
                        <h3>Computer Education</h3>
                        <p>Learn technology skills.</p>
                    </div>
                </div>

            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button" data-bs-target="#mySlider" data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>
            </button>

            <!-- Next Button -->
            <button class="carousel-control-next" type="button" data-bs-target="#mySlider" data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
