<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment with Bootstrap Grid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center text-primary mb-4">
            Experiment with Grid
        </h1>

        <h4>Example 1: Two Equal Columns</h4>
        <div class="row mb-4">
            <div class="col-6">
                <div class="bg-primary text-white p-3 text-center">
                    Column 1 (50%)
                </div>
            </div>

            <div class="col-6">
                <div class="bg-success text-white p-3 text-center">
                    Column 2 (50%)
                </div>
            </div>
        </div>

        <h4>Example 2: Three Equal Columns</h4>
        <div class="row mb-4">
            <div class="col-4">
                <div class="bg-danger text-white p-3 text-center">
                    Column 1
                </div>
            </div>

            <div class="col-4">
                <div class="bg-warning text-dark p-3 text-center">
                    Column 2
                </div>
            </div>

            <div class="col-4">
                <div class="bg-info text-dark p-3 text-center">
                    Column 3
                </div>
            </div>
        </div>

        <h4>Example 3: Four Equal Columns</h4>
        <div class="row">
            <div class="col-3">
                <div class="bg-primary text-white p-3 text-center">
                    One
                </div>
            </div>

            <div class="col-3">
                <div class="bg-success text-white p-3 text-center">
                    Two
                </div>
            </div>

            <div class="col-3">
                <div class="bg-danger text-white p-3 text-center">
                    Three
                </div>
            </div>

            <div class="col-3">
                <div class="bg-dark text-white p-3 text-center">
                    Four
                </div>
            </div>
        </div>

    </div>

</body>

</html>
