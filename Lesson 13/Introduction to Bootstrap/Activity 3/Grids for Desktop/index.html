<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Desktop Grid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center text-primary mb-4">
            Responsive Bootstrap Grid
        </h1>

        <div class="row g-3">

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-primary text-white p-4 text-center">
                    <h3>HTML</h3>
                    <p>Learn Web Structure</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-success text-white p-4 text-center">
                    <h3>CSS</h3>
                    <p>Learn Web Design</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-danger text-white p-4 text-center">
                    <h3>JavaScript</h3>
                    <p>Learn Programming</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="bg-dark text-white p-4 text-center">
                    <h3>Bootstrap</h3>
                    <p>Learn Responsive Design</p>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
