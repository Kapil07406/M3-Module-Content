<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Container Fluid</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- Full Width Header -->
    <div class="container-fluid bg-primary text-white text-center p-5">

        <h1>My Website</h1>
        <p>Welcome to my learning website</p>

    </div>

    <!-- Full Width Content -->
    <div class="container-fluid bg-light p-4">

        <h2>About Us</h2>

        <p>
            Welcome to our website.
            We provide learning resources for students.
            Learn HTML, CSS, JavaScript and Bootstrap.
        </p>

    </div>

    <!-- Full Width Footer -->
    <div class="container-fluid bg-dark text-white text-center p-3">

        <p class="mb-0">Copyright 2026 | My Website</p>

    </div>

</body>

</html>
