<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Colors and Borders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center text-primary mb-4">
            Bootstrap Colors and Borders
        </h1>

        <!-- Background Colors -->
        <h3>Background Colors</h3>

        <div class="bg-primary text-white p-3 mb-3">
            Primary Background
        </div>

        <div class="bg-success text-white p-3 mb-3">
            Success Background
        </div>

        <div class="bg-danger text-white p-3 mb-3">
            Danger Background
        </div>

        <div class="bg-warning text-dark p-3 mb-4">
            Warning Background
        </div>

        <hr>

        <!-- Borders -->
        <h3>Border Examples</h3>

        <div class="border border-primary border-3 p-3 mb-3">
            Blue Border
        </div>

        <div class="border border-success border-3 p-3 mb-3">
            Green Border
        </div>

        <div class="border border-danger border-3 rounded p-3 mb-3">
            Red Border with Rounded Corners
        </div>

        <div class="border border-dark rounded-pill p-3 mb-3">
            Pill Shape Border
        </div>

        <!-- Shadow -->
        <div class="border shadow rounded p-4 mt-4">
            <h4>My Box</h4>
            <p>This box has a shadow and rounded corners.</p>
        </div>

    </div>

</body>

</html>
