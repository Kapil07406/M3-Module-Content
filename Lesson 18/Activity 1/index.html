<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">My Image Gallery</h2>

        <div id="myCarousel" class="carousel slide" data-bs-ride="carousel">

            <!-- Indicators -->
            <div class="carousel-indicators">

                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active">
                </button>

                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1">
                </button>

                <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2">
                </button>

            </div>

            <!-- Carousel Images -->
            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="https://picsum.photos/id/1018/1000/400" class="d-block w-100" alt="Mountain">

                    <div class="carousel-caption">
                        <h3>Beautiful Mountains</h3>
                        <p>Explore the beauty of nature.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1015/1000/400" class="d-block w-100" alt="River">

                    <div class="carousel-caption">
                        <h3>Peaceful River</h3>
                        <p>Enjoy the beauty of rivers.</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="https://picsum.photos/id/1019/1000/400" class="d-block w-100" alt="Forest">

                    <div class="carousel-caption">
                        <h3>Green Forest</h3>
                        <p>Discover amazing places.</p>
                    </div>
                </div>

            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>
            </button>

            <!-- Next Button -->
            <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
