<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Scrollspy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        section {
            min-height: 450px;
            padding: 100px 30px;
        }

        #home {
            background-color: #dbeafe;
        }

        #about {
            background-color: #dcfce7;
        }

        #services {
            background-color: #fef3c7;
        }

        #contact {
            background-color: #fce7f3;
        }
    </style>
</head>

<body data-bs-spy="scroll" data-bs-target="#myNavbar" data-bs-smooth-scroll="true" tabindex="0">

    <!-- Navigation -->
    <nav id="myNavbar" class="navbar navbar-expand bg-dark sticky-top">

        <div class="container">

            <a class="navbar-brand text-white" href="#home">
                My Website
            </a>

            <ul class="navbar-nav nav-pills">

                <li class="nav-item">
                    <a class="nav-link text-white" href="#home">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#about">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#services">
                        Services
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link text-white" href="#contact">
                        Contact
                    </a>
                </li>

            </ul>

        </div>
    </nav>

    <!-- Sections -->
    <section id="home">
        <h1>Home</h1>
        <p>Welcome to my website.</p>
    </section>

    <section id="about">
        <h1>About Us</h1>
        <p>Learn more about our website.</p>
    </section>

    <section id="services">
        <h1>Our Services</h1>
        <p>We provide different services.</p>
    </section>

    <section id="contact">
        <h1>Contact Us</h1>
        <p>Get in touch with us.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
